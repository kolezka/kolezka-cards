name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_SECRET: ci_dummy_secret_replace_in_prod_5fbe1c2e3a4d6f7889ab1234cdef5678
      BASE_URL: http://localhost:3001
      DATABASE_PATH: /tmp/ci.db
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: SvelteKit sync (generates .svelte-kit/tsconfig.json)
        working-directory: apps/web
        run: bun x svelte-kit sync

      - name: Biome (lint + format check)
        run: bun x biome check .

      - name: Typecheck — packages/shared
        run: bun x tsc -p packages/shared --noEmit

      - name: Typecheck — packages/db
        run: bun x tsc -p packages/db --noEmit

      - name: Typecheck — apps/api
        run: bun x tsc -p apps/api --noEmit

      - name: svelte-check — apps/web
        working-directory: apps/web
        run: bun x svelte-check --tsconfig ./tsconfig.json --threshold error

      - name: Tests
        run: bun test

      - name: Build SvelteKit (verify production build succeeds)
        working-directory: apps/web
        run: bun run build

  docker:
    name: Docker build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
