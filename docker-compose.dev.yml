# Development compose — runs postgres, api (:3001) and web (:5173) inside
# containers with the source bind-mounted for hot reload. Use this only when
# you want containerized dev parity; the preferred path remains `bun run dev`
# on the host (against a local or remote Postgres).
#
#   docker compose -f docker-compose.dev.yml up
#   open http://localhost:5173
#   curl -i http://localhost:3001/healthz
#
# Notes:
# - node_modules is excluded from the bind via a named volume so Alpine
#   linux installs don't clobber the host's macOS/Linux installs.
# - Postgres is exposed on host port 5434 (not 5432) to avoid conflicts
#   with a local postgres install. Data persists in the `dev-pg` volume.
# - The api container waits for postgres to be healthy, runs seed on
#   first start, then `bun --hot` so source edits hot-reload. Schema
#   migrations are applied inline by the API at startup (see
#   runStartupMigrations in apps/api/src/index.ts), so the compose
#   command no longer needs a separate migrate step.

services:
  postgres:
    image: postgres:16-alpine
    container_name: kolezka-cards-dev-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: kc
      POSTGRES_PASSWORD: kc_dev
      POSTGRES_DB: kc_dev
    ports:
      - '5434:5432'
    volumes:
      - dev-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kc -d kc_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: oven/bun:1.3.10-alpine
    container_name: kolezka-cards-dev-api
    working_dir: /app
    command: >
      sh -c "bun install --frozen-lockfile &&
             bun run packages/db/src/seed.ts &&
             bun --hot run apps/api/src/index.ts"
    ports:
      - '3001:3001'
    environment:
      APP_SECRET: dev_only_secret_replace_in_prod_5fbe1c2e3a4d6f7889ab1234cdef5678
      BASE_URL: http://localhost:3001
      DATABASE_URL: postgresql://kc:kc_dev@postgres:5432/kc_dev
      NODE_ENV: development
      PORT: '3001'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - dev-node-modules:/app/node_modules

  web:
    image: oven/bun:1.3.10-alpine
    container_name: kolezka-cards-dev-web
    working_dir: /app/apps/web
    command: >
      sh -c "cd /app && bun install --frozen-lockfile &&
             cd /app/apps/web && bun x svelte-kit sync &&
             bun x vite dev --host 0.0.0.0 --port 5173 --strictPort"
    ports:
      - '5173:5173'
    depends_on:
      - api
    environment:
      VITE_API_ORIGIN: http://api:3001
    volumes:
      - .:/app
      - dev-node-modules:/app/node_modules

volumes:
  dev-node-modules:
  dev-pg:
