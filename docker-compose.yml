# Production compose — mirrors the Coolify deployment shape so you can
# smoke-test the full prod image locally before pushing.
#
#   docker compose up -d --build
#   curl -i http://localhost:3000/healthz
#   docker compose logs -f app
#
# Coolify itself points at docker/Dockerfile directly and does not use this
# file, but the env variables, volume mount, and port match what Coolify
# configures, so anything that works here works there.

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: kolezka-cards:latest
    container_name: kolezka-cards
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_PATH: /data/app.db
      WEB_BUILD_DIR: /app/apps/web/build
    volumes:
      - app-data:/data
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  app-data:
