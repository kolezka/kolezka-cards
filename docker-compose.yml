services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    image: kolezka-cards-pg:latest
    container_name: kolezka-cards-pg
    restart: unless-stopped
    environment:
      # POSTGRES_USER=kc and POSTGRES_DB=kc_cards are baked into the
      # custom image (docker/postgres.Dockerfile) so they don't surface
      # in Coolify's env tab as "deletable but required" constants.
      # Only the password ever needs to be configured by the operator.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your env}
    volumes:
      - app-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kc -d kc_cards']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: kolezka-cards:latest
    container_name: kolezka-cards
    restart: unless-stopped
    # No host-port mapping — Coolify's reverse proxy talks to the container
    # directly on the compose network. `expose` documents the contract and
    # mirrors EXPOSE 3000 in the Dockerfile.
    expose:
      - '3000'
    environment:
      # Only the values that operators actually configure. Postgres
      # host / user / db / port have compose-aware defaults in
      # resolveDatabaseUrl(); NODE_ENV / PORT / WEB_BUILD_DIR are pinned
      # in the Dockerfile. Keeping this list short means Coolify's env
      # tab stays free of redundant constants.
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET (>= 32 chars) in your env}
      BASE_URL: ${BASE_URL:?Set BASE_URL in your env (e.g. https://cards.example.com)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your env}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # Optional PAT; lifts the GitHub REST API rate limit from 60/hr
      # to 5000/hr so heavy use (profile-stats, repo-stats, gist-counter,
      # profile-summary, custom cards with github.* sources) doesn't 502.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      ADMIN_LOGINS: ${ADMIN_LOGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  app-pg:
