services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: kolezka-cards:latest
    container_name: kolezka-cards
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      APP_SECRET: ${APP_SECRET:-changemechangemechangemechangeme}
      BASE_URL: ${BASE_URL:-https://cards.example.com}
      NODE_ENV: production
      PORT: '3000'
      # Either inject DATABASE_URL directly (Coolify's preferred form) or
      # provide the POSTGRES_* bundle below and let the app compose the URL.
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      WEB_BUILD_DIR: /app/apps/web/build
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      ADMIN_LOGINS: ${ADMIN_LOGINS}
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
