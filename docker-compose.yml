services:
  postgres:
    image: postgres:16-alpine
    container_name: kolezka-cards-pg
    restart: unless-stopped
    environment:
      # Hardcoded — don't depend on env-file substitution (Coolify can inject
      # empty values that defeat `${VAR:-default}` semantics). The only
      # required user input is the password.
      POSTGRES_USER: kc
      POSTGRES_DB: kc_cards
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your env}
    volumes:
      - app-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kc -d kc_cards']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: kolezka-cards:latest
    container_name: kolezka-cards
    restart: unless-stopped
    # No host-port mapping — Coolify's reverse proxy talks to the container
    # directly on the compose network. `expose` documents the contract and
    # mirrors EXPOSE 3000 in the Dockerfile.
    expose:
      - '3000'
    environment:
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET (>= 32 chars) in your env}
      BASE_URL: ${BASE_URL:?Set BASE_URL in your env (e.g. https://cards.example.com)}
      NODE_ENV: production
      PORT: '3000'
      POSTGRES_HOST: postgres
      POSTGRES_USER: kc
      POSTGRES_DB: kc_cards
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your env}
      WEB_BUILD_DIR: /app/apps/web/build
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      ADMIN_LOGINS: ${ADMIN_LOGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  app-pg:
