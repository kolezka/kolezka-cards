services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: kolezka-cards:latest
    container_name: kolezka-cards
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      APP_SECRET: ${APP_SECRET:-changemechangemechangemechangeme}
      BASE_URL: ${BASE_URL:-https://cards.example.com}
      NODE_ENV: production
      PORT: '3000'
      DATABASE_PATH: /data/app.db
      WEB_BUILD_DIR: /app/apps/web/build
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
    volumes:
      - app-data:/data
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  app-data:
