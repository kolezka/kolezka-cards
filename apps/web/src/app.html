<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="noindex" />
    <title>kolezka-cards</title>
    %sveltekit.head%

    <!-- Cloudflare Web Analytics — cookieless, no PII collected. Loaded only
         on the production hostname so localhost / preview deploys don't
         pollute the metrics. Documented as a sub-processor in /privacy. -->
    <script>
      (function () {
        if (location.hostname !== 'ghcards.raqz.link') return;
        var s = document.createElement('script');
        s.defer = true;
        s.src = 'https://static.cloudflareinsights.com/beacon.min.js';
        s.setAttribute(
          'data-cf-beacon',
          '{"token": "e7a3a4a2b03e4c92a0e6c982834a8b78"}'
        );
        document.head.appendChild(s);
      })();
    </script>
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
